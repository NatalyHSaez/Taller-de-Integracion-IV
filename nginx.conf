server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Expo Router usa rutas del lado del cliente.
    # Cualquier ruta que no sea un archivo estático se redirige a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache largo para assets con hash (JS, CSS, imágenes generadas por Expo)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
