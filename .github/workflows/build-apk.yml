name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Configure EAS project
        run: eas init --id $(eas project:info --json --non-interactive | jq -r '.id // empty' || echo "") --non-interactive 2>/dev/null || eas init --account natalys --non-interactive

      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive --no-wait

      - name: Wait and get APK URL
        run: |
          echo "Esperando que el build termine..."
          sleep 30
          for i in $(seq 1 60); do
            STATUS=$(eas build:list --platform android --limit 1 --json --non-interactive | jq -r '.[0].status')
            echo "Intento $i: status=$STATUS"
            if [ "$STATUS" = "FINISHED" ]; then
              URL=$(eas build:list --platform android --limit 1 --json --non-interactive | jq -r '.[0].artifacts.buildUrl')
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              break
            elif [ "$STATUS" = "ERRORED" ]; then
              echo "Build falló en EAS"
              exit 1
            fi
            sleep 60
          done
        id: apk

      - name: Download APK
        run: curl -L -o app.apk "${{ steps.apk.outputs.url }}"

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Última versión APK
          files: app.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
