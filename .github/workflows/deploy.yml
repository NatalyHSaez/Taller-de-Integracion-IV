name: Deploy to Kubero

on:
  workflow_run:
    workflows: ["Build app image"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy-kubero:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy app en Kubero
        run: |
          curl -s -o /dev/null -w "App: %{http_code}\n" -X GET \
            "${{ secrets.KUBERO_URL }}/restart" \
            -H "Authorization: Bearer ${{ secrets.KUBERO_TOKEN }}"
